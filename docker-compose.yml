services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-swaad_sutra}
      MYSQL_USER: ${DB_USER:-swaad_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_app_change_me}
    ports:
      - "3307:3306"
    volumes:
      - swaad_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-local_root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-swaad_app}
      DB_PASSWORD: ${DB_PASSWORD:-local_app_change_me}
      DB_NAME: ${DB_NAME:-swaad_sutra}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      OWNER_WHATSAPP_NUMBER: ${OWNER_WHATSAPP_NUMBER:-}
    depends_on:
      mysql:
        condition: service_healthy
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
volumes:
  swaad_mysql_data: